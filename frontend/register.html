<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация - Habit Game</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <h1>🎮 Habit Game</h1>
            <h2>Создай аккаунт</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" placeholder="Введите имя" required />
                </div>
                <div class="form-group">
                    <label for="email">Email (необязательно)</label>
                    <input type="email" id="email" placeholder="Введите email" />
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Минимум 8 символов" required />
                </div>
                <div class="form-group">
                    <label for="password2">Подтвердите пароль</label>
                    <input type="password" id="password2" placeholder="Повторите пароль" required />
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn-primary" style="width:100%;">Зарегистрироваться</button>
                <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            if (password !== password2) {
                errorDiv.textContent = 'Пароли не совпадают';
                errorDiv.style.display = 'block';
                return;
            }
            try {
                await registerUser(username, password, password2, email);
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Ошибка регистрации';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
