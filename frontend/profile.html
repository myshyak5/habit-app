<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль - Habit Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'>🎮</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🎮 Habit RPG</div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Дашборд</a>
                <a href="profile.html" class="nav-link active">👤 Профиль</a>
                <a href="shop.html" class="nav-link">🛒 Магазин</a>
            </nav>
            <button class="btn-logout" id="logoutBtn">Выйти</button>
        </div>
    </header>
    <div class="profile-container">
        <div class="profile-box">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">😊</div>
                <div>
                    <h1 class="profile-name" id="profileUsername">Пользователь</h1>
                    <span class="profile-level-badge">🏆 Уровень <span id="profileLevel">1</span></span>
                </div>
            </div>
            <div class="profile-stats">
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-value" id="profileXP">0</div>
                    <div class="stat-label">Опыт (XP)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-value" id="profileGold">0</div>
                    <div class="stat-label">Золото</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value" id="profileCompleted">0</div>
                    <div class="stat-label">Выполнено привычек</div>
                </div>
            </div>
            <div class="chart-container">
                <h3>📈 Активность за неделю</h3>
                <div><canvas id="activityChart"></canvas></div>
            </div>
            <hr />
            <h3 style="margin-bottom:15px;">🎨 Выберите аватар</h3>
            <div class="avatar-selector" id="avatarSelector">
                <div class="avatar-option" data-avatar="😊">😊</div>
                <div class="avatar-option" data-avatar="🧙‍♂️">🧙‍♂️</div>
                <div class="avatar-option" data-avatar="🦸‍♂️">🦸‍♂️</div>
                <div class="avatar-option" data-avatar="🐉">🐉</div>
                <div class="avatar-option" data-avatar="🚀">🚀</div>
            </div>
            <div class="profile-actions">
                <a href="dashboard.html" class="btn-profile btn-back">← Назад к привычкам</a>
                <button class="btn-profile btn-save" id="saveAvatarBtn">💾 Сохранить аватар</button>
            </div>
            <div class="danger-zone">
                <button class="btn-danger" id="deleteAccountBtn">🗑️ Удалить аккаунт</button>
                <p>⚠️ Это действие необратимо. Все данные будут удалены.</p>
            </div>
        </div>
    </div>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/store.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/habits.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
