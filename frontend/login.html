<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход - Habit Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'>🎮</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <h1>🎮 Habit Game</h1>
            <h2>Вход в аккаунт</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" placeholder="Введите имя" required />
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите пароль" required />
                </div>

                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn-primary" style="width:100%;">
                    Войти
                </button>
                <p class="auth-link">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            try {
                await loginUser(username, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Ошибка входа';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
