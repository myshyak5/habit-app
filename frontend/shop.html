<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин - Habit RPG</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .shop-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .shop-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .shop-gold {
            background: linear-gradient(135deg, #feca57 0%, #f9a825 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(254, 202, 87, 0.4);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .shop-item {
            background: white;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .shop-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .shop-item.owned {
            border-color: #2ecc71;
            background: #f0fff4;
        }

        .shop-item.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .shop-item-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .shop-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .shop-item-hint {
            font-size: 12px;
            font-weight: 400;
            color: #696969;
            margin: 4px 0 6px 0;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            min-height: 24px;
            line-height: 1.4;
        }

        /* ===== КНОПКИ ===== */
        .shop-item .btn-buy {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s ease;
            border: none;
            margin-top: auto;
            letter-spacing: 0.3px;
        }

        .shop-item .btn-buy:not(:disabled):not(.owned):not(.selected) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .shop-item .btn-buy:not(:disabled):not(.owned):not(.selected):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .shop-item .btn-buy.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            cursor: default;
        }

        .shop-item .btn-buy.owned:not(.selected) {
            background: #34c759;
            color: white;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.3);
        }

        .shop-item .btn-buy.owned:not(.selected):hover {
            background: #28a745;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 199, 89, 0.4);
        }

        .shop-item .btn-buy:disabled {
            background: #d1d5db;
            color: #6b7280;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
            border: 1px solid #d1d5db;
        }

        .shop-empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .shop-empty .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .shop-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .shop-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🎮 Habit RPG</div>
            <nav class="nav-links">
                <a href="dashboard.html">📊 Дашборд</a>
                <a href="profile.html">👤 Профиль</a>
                <a href="shop.html" class="active">🛒 Магазин</a>
            </nav>
            <button onclick="logoutUser()" class="btn-logout">Выйти</button>
        </div>
    </header>

    <main class="shop-container">
        <div class="shop-box" style="background:white;padding:30px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div class="shop-header">
                <h1 class="shop-title">🛒 Магазин скинов</h1>
                <div class="shop-gold">💵 <span id="shopGold">0</span></div>
            </div>

            <div class="shop-grid" id="shopGrid">
                <!-- Товары загружаются через JS -->
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
