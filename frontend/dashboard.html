<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дашборд - Habit Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🎮 Habit RPG</div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link" data-page="dashboard" class="active">📊 Дашборд</a>
                <a href="profile.html" class="nav-link" data-page="profile">👤 Профиль</a>
                <a href="shop.html" class="nav-link" data-page="shop">🛒 Магазин</a>
            </nav>
            <button onclick="logoutUser()" class="btn-logout">Выйти</button>
        </div>
    </header>
    <div class="dashboard-wrapper">
        <main class="dashboard-container">
            <div class="dashboard-box">
                <div class="dashboard-header">
                    <div class="user-info">
                        <div class="avatar" id="characterAvatar">😊</div>
                        <div>
                            <h2 id="usernameDisplay">Пользователь</h2>
                            <div class="user-stats">
                                <span>🏆 Уровень <span id="levelDisplay">1</span></span>
                                <span>⭐ Опыт <span id="xpDisplay">0</span></span>
                                <span>💰 Золото <span id="goldDisplay">0</span></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="xpProgress">
                            <span class="progress-percent" id="xpPercent">0%</span>
                        </div>
                        <div class="xp-tooltip" id="xpTooltip">
                            <span id="tooltipCurrentXP">0</span> / <span id="tooltipTotalXP">100</span> XP
                        </div>
                    </div>
                    <span id="xpProgressText">До следующего уровня необходимо 100 XP</span>
                </div>
                <button class="add-habit-btn" id="addHabitBtn">➕ Добавить привычку</button>
                <div class="habits-list" id="habitsList">
                    <div class="empty-state">
                        <p>😴 У вас пока нет привычек</p>
                        <p style="font-size:14px;">Нажмите кнопку выше, чтобы добавить первую</p>
                    </div>
                </div>
            </div>
        </main>
        <aside class="sidebar">
            <div class="sidebar-box">
                <h3>📋 Ежедневные задания</h3>
                <div id="dailyQuestsList"></div>
            </div>
        </aside>
    </div>
    <div id="addHabitModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>➕ Новая привычка</h3>
            <form id="addHabitForm">
                <div class="form-group">
                    <label for="habitName">Название привычки</label>
                    <input type="text" id="habitName" placeholder="Например: Сделать зарядку" required>
                </div>
                <div class="form-group">
                    <label for="habitDescription">Описание (необязательно)</label>
                    <input type="text" id="habitDescription" placeholder="Краткое описание">
                </div>
                <div class="form-group">
                    <label>Сложность (опыт)</label>
                    <div class="difficulty-selector">
                        <button type="button" class="diff-btn easy" data-xp="20" onclick="selectDifficulty('easy', 20, this)">
                            🟢 Лёгкий<br><small>+20 XP</small>
                        </button>
                        <button type="button" class="diff-btn medium" data-xp="40" onclick="selectDifficulty('medium', 40, this)">
                            🟡 Средний<br><small>+40 XP</small>
                        </button>
                        <button type="button" class="diff-btn hard" data-xp="60" onclick="selectDifficulty('hard', 60, this)">
                            🔴 Сложный<br><small>+60 XP</small>
                        </button>
                    </div>
                    <input type="hidden" id="habitXp" value="20">
                </div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button type="submit" class="btn-primary" style="flex:1;">➕ Добавить</button>
                    <button type="button" class="btn-secondary" onclick="closeHabitModal()" style="flex:1;">Отмена</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/habits.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
